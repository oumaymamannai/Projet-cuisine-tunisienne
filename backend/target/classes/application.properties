spring.application.name=mondelys-backend

spring.datasource.url=jdbc:mysql://localhost:3306/mondelys_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.web.resources.static-locations=classpath:/static/,file:../

app.jwt.secret=${JWT_SECRET:replace_with_a_very_long_random_secret_key_at_least_32_chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

app.mail.from=${MAIL_FROM:no-reply@mondelys.tn}

server.port=8080
